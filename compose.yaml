services:
  backend:
    build: ./backend
    ports:
      - "8070:8070"
    env_file:
      - backend/.env

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      # nginx in the frontend container proxies /api to this address
      BACKEND_URL: http://backend:8070
    depends_on:
      - backend
